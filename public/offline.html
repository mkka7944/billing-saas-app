<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TMT Billing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #e2e8f0; text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; }
    p { color: #94a3b8; font-size: 0.875rem; }
    .retry { margin-top: 1.5rem; padding: 0.5rem 1.5rem; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .retry:hover { background: #334155; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button class="retry" onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
